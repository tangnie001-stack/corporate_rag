# litellm/config.test.yaml - 测试配置文件
# 与 config.yaml 的唯一区别：qwen3.7-max 的 api_key 改为错误值，用于触发 fallback
model_list:
  # DashScope LLM（OpenAI 兼容模式）—— 使用错误 key 模拟故障
  - model_name: qwen3.7-max
    litellm_params:
      model: openai/qwen3.7-max
      api_key: sk-invalid-for-test
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1

  # DeepSeek LLM（原生模式，qwen3.7-max 的 fallback）
  - model_name: deepseek-v4-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: sk-bd05bb62e9254ce6b19f5a2879cffe6f
      api_base: https://api.deepseek.com

  # DashScope Embedding（OpenAI 兼容模式）
  - model_name: qwen3.7-text-embedding
    litellm_params:
      model: openai/qwen3.7-text-embedding
      api_key: sk-1e8da9d336654dbba5e932143b6b1ecc
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1

  # DeepSeek Embedding（OpenAI 兼容模式）
  - model_name: deepseek-embed-v4
    litellm_params:
      model: openai/deepseek-embed-v4
      api_key: sk-bd05bb62e9254ce6b19f5a2879cffe6f
      api_base: https://api.deepseek.com

litellm_settings:
  fallbacks: [{"qwen3.7-max": ["deepseek-v4-flash"]}]
  num_retries: 3
  request_timeout: 10
  allowed_fails: 3
  cooldown_time: 30
