# 生产部署配置文件
# 使用方式: docker compose -f docker-compose.prod.yml up -d
# 相比 docker-compose.yml 的调整:
#   1. 移除 mem_reservation（生产不需要软保障）
#   2. 调大 mem_limit 适配生产数据量
#   3. 内部服务不暴露端口，仅 nginx 对外
#   4. 重启策略改为 always
#
# ⚠ prod 与 dev 必须在不同机器上运行：两份 compose 的 project name、容器名与
# 全部卷名完全相同，同机执行会因容器名冲突直接失败（--force-recreate 还会拆掉先起的那套）。
# 本轮 prod 不部署：RDS 托管化另案（见 postgres-storage-consolidation 的遗留项）。
#
# ⚠ MySQL 容器 corporate-rag-mysql、命名卷 corporate_rag_mysql_data 与镜像 mysql:8.0
#   已于 2026-09-20 全部清理（见 docs/adr/0007-retire-mysql-rollback-basis.md）；
#   Chroma 语料与 BM25 索引已在 P4 删除，旧实现（MySQL + Chroma + BM25）的三套回滚依据
#   均已不存在，回滚到 pre-P1 实现不再可行。
#   具体禁令（保护在用的运行时命名卷）：
#     1) 不要 `docker compose down -v`（-v 会真的删命名卷）
#     2) 不要 `docker volume prune` / `docker system prune --volumes`
name: corporate_rag
services:
  redis:
    image: redis:7-alpine
    mem_limit: 2g
    container_name: corporate-rag-redis
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:?}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  postgres:
    image: pgvector/pgvector:pg15
    mem_limit: 4g
    container_name: corporate-rag-postgres
    restart: always
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASS:?LANGFUSE_POSTGRES_PASS is required}
      # 应用库的应用账号密码，供 init 脚本使用
      POSTGRES_APP_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - app-network

  minio:
    image: cgr.dev/chainguard/minio
    mem_limit: 2g
    container_name: corporate-rag-minio
    restart: always
    entrypoint: sh
    command: -c 'minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    # 生产按需暴露，如用外部 S3 客户端则保留
    ports:
      - "${MINIO_S3_PORT:-9000}:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  langfuse-web:
    image: langfuse/langfuse:2.95.11
    mem_limit: 2g
    container_name: corporate-rag-langfuse-web
    restart: always
    depends_on:
      postgres: { condition: service_healthy }
    # 生产典型场景：通过反代暴露，或直接暴露供团队使用
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASS:?}@postgres:5432/langfuse
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      SALT: ${LANGFUSE_SALT:?LANGFUSE_SALT is required}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?LANGFUSE_ENCRYPTION_KEY is required}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
      # v2 的 Next.js standalone 默认绑回环，且 Docker 会把 HOSTNAME 设为容器 ID
      # → 必须显式绑 0.0.0.0，否则 app 经 langfuse-web:3000 不可达（静默走本地兜底）
      HOSTNAME: "0.0.0.0"
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    networks:
      - app-network

  nginx:
    build: ./deploy/nginx
    mem_limit: 256m
    container_name: corporate-rag-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - app-network

  app:
    build: .
    mem_limit: 4g
    container_name: corporate-rag-app
    restart: always
    # 生产用多 worker 提升并发
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 4
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: corporate_rag
      POSTGRES_DATABASE: corporate_rag
      LOG_DIR: /data/logs
    volumes:
      - app_logs:/data/logs
      - ./skills:/app/skills
      - ./agents:/app/agents
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - app-network

volumes:
  redis_data:
    name: corporate_rag_redis_data
  postgres_data:
    name: corporate_rag_postgres_data
  minio_data:
    name: corporate_rag_minio_data
  app_logs:
    name: corporate_rag_app_logs

networks:
  app-network:
    name: corporate_rag_network
