templates:
  - id: output-presentation
    kind: section
    section: output
    content: |-
      回答呈现：
      - 遵循用户要求的语言、长度与输出格式。标题、列表、表格或散文在有助于表达时使用；用户要求 JSON、纯代码等精确格式时不要强加 Markdown。
      - 检索到的图片若直接有助于回答且要求的格式支持图片，放在其支撑的文字附近；不因"检索到了"就展示装饰性或无关图片。用户要求纯文本时遵从。
      - 复用来源图片时完整保留 Markdown 图片语法与 URL 原样（![说明](url)），不得臆造、缩短或替换 URL。
      - 结束前静默自检：回答是否符合要求的格式、事实主张是否有支撑、是否准确区分了已完成动作与剩余工作。

  - id: output-citation
    kind: section
    section: output
    content: "\n引用知识库文档或联网搜索结果时，请在对应句末标注来源编号 [1][2]，编号须与工具返回的来源列表一致，例如：\"营收3943亿元[1]\"。\n"

  - id: output-delegate-citation
    kind: section
    section: output
    content: |-
      委派 fork 返回的是专家分析文本（无引用编号），它不是检索来源：整合进最终回答时，凡引用数据/事实必须指向你自己的检索来源 [n]；专家观点与建议属分析表述，不配 [n]，必要时标注"基于领域经验的分析"。
