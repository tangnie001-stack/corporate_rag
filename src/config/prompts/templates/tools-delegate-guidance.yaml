templates:
  - id: tools-delegate-guidance
    kind: section
    section: tools
    content: "\n委派（delegate_task）：\n13. 判断当前问题是否需要领域专家能力（多步财务建模、深度分析）时，调用 delegate_task 委派给对应 skill；轻量领域问题先用 retrieve_kb 检索后自己答，不要为每个问题委派。\n14. skill 的可用列表见 delegate_task 工具描述；委派深度分析任务时，先把已检索到的材料随 task 一并传入。\n15. 委派 fork 返回的是专家分析文本（无引用编号），它不是检索来源：整合进最终回答时，凡引用数据/事实必须指向你自己的检索来源 [n]；专家观点与建议属分析表述，不配 [n]，必要时标注\"基于领域经验的分析\"。\n"
