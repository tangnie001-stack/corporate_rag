[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "corporate-rag"
version = "0.1.0"
description = "Financial Document QA Assistant - MVP"
authors = [{name = "tangnie"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy<2.0",
    "langchain-openai==1.3.3",
    "langchain==1.3.11",
    "langchain-community==0.4.2",
    "langchain-core==1.4.8",
    "langchain-text-splitters==1.1.2",
    "langgraph==1.2.9",
    "langfuse>=2.60.0,<3.0.0",
    "fastapi==0.138.0",
    "httpx>=0.27,<1.0",
    "python-multipart==0.0.20",
    "uvicorn[standard]==0.49.0",
    "pymupdf==1.28.2",
    "python-docx==1.2.0",
    "python-dotenv==1.2.2",
    "loguru==0.7.3",
    "chardet==7.4.3",
    "redis==8.0.0",
    "dashscope>=1.26.3",
    # pin 精确版本：分词结果随 chunks.tsv 生成列固化落库，版本漂移会让存量与新
    # 查询侧口径不一致（静默降召回），变更必须配 scripts/rewrite_content_seg.py --apply
    "jieba==0.42.1",
    "minio>=7.2.0,<8.0.0",
    "pymupdf4llm==1.28.2",
    # PostgreSQL 关系型存储：asyncpg 为 SQLAlchemy 异步驱动，pgvector 提供向量类型，
    # sqlalchemy 此前仅作传递依赖，已被直接 import，故显式声明并带 asyncio extra
    "asyncpg>=0.30.0,<1.0.0",
    "pgvector>=0.3.6,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    # 密码哈希：src/utils/auth_crypto.py 直接 import bcrypt；此前仅由 chromadb 传递提供，
    # 已随 Chroma 退役一并消失，故显式声明为运行时依赖，不可移除
    "bcrypt==5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "ragas==0.4.3",
    "rapidfuzz==3.14.5",
    "datasets==4.0.0",
    "pyright==1.1.411",
    "pre-commit==4.6.1",
    "ruff==0.16.2",
    "alembic==1.19.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# async 测试共享 session 级 event loop，避免 SQLAlchemy async 连接池
# 跨 loop 复用导致 "Task got Future attached to a different loop"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"

[tool.pyright]
extraPaths = ["src"]
# 显式指定 python 解释器来源的 venv，确保第三方依赖可解析
venvPath = "."
venv = ".venv"

[tool.doc_anchors]
# 文档防腐检查（src/cli/check_docs.py）排除表。
# exclude_docs: 整篇跳过校验（意向清单/外部引用）
# exclude_symbols: 允许出现在文档但不要求代码中存在的标识符
#   （事故档案中的历史函数名、API 数据枚举值等）
# exclude_skill_tools: skill frontmatter allowed-tools 中允许引用但代码不存在的工具名
#   （如文档/示例中的历史工具名）
exclude_docs = ["requirements_pool.md", "reference-projects.md", "codegraph-guide.md"]
exclude_symbols = [
    "ci_gate",
    "handle_chat",
    "create_kb",
    # chunking-issues.md 档案中的历史旧名（迁移时已拆分，注记指向现状）
    "HEADER_FOOTER_MARGIN",
]
exclude_skill_tools = []


[tool.ruff.lint.per-file-ignores]
# FastAPI 路由的 Depends()/File() 默认参数是官方依赖注入的标准写法，B008 为误报
"src/api/*.py" = ["B008"]
